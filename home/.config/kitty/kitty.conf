# Clavis desktop integration: generated by the project's Kitty Matugen template.
include current-theme.conf

# Fonts: use installed families, with Chinese and emoji fallback handled by Fontconfig.
font_family JetBrains Mono
bold_font auto
italic_font auto
bold_italic_font auto
font_size 12.5

# A quiet frame with breathing room for text.
window_padding_width 16
single_window_padding_width 16
hide_window_decorations yes
background_opacity 0.72
background_blur 16
dynamic_background_opacity yes

# Subtle cursor and a clean scrollbar-free canvas.
cursor_shape block
cursor_blink_interval 0.5 ease-in-out
cursor_trail 1
cursor_trail_decay 0.10 0.30
cursor_trail_start_threshold 1
scrollback_lines 10000

# Tabs appear only when needed; their colors follow Clavis.
tab_bar_min_tabs 2
tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted
active_tab_font_style bold
inactive_tab_font_style normal

# Let Kitty select the available display backend (Wayland in the Niri session).
linux_display_server auto

# Nerd Font symbols for the Clavis-colored command prompt.
symbol_map U+E000-U+F8FF,U+F0000-U+FFFFD Symbols Nerd Font Mono

# Keep the configured block cursor at the Bash prompt.
shell_integration enabled no-cursor
