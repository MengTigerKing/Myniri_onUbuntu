# Compact welcome card for new Kitty windows.
print_info() {
    prin "Desktop" "Niri / Clavis"
    info "OS" distro
    info "Kernel" kernel
    info "Uptime" uptime
    info "Shell" shell
    prin "Terminal" "Kitty 0.49.2"
    info "Memory" memory
}
image_backend="ascii"
ascii_distro="ubuntu_small"
ascii_colors=(254 252)
colors=(254 254 252 254 7 7)
bold="on"
underline_enabled="off"
separator="  "
color_blocks="off"
os_arch="off"
distro_shorthand="on"
kernel_shorthand="on"
uptime_shorthand="on"
shell_version="on"
stdout="off"
gap=3
